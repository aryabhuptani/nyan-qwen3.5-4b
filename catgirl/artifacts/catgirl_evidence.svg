<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">We made Qwen a catgirl</title>
  <desc id="description">Qwen3.5-4B,4096 neuron coordinates. Real excerpt from the original BF16 seven-turn conversation in results/071_bf16_frozen_stress.jsonl, final identity question. The displayed answer omits a middle sentence, marked with an ellipsis. The persona was induced using a learned activation recipe. This layout omits technical protocol details; full details and limitations are in the linked repository.</desc>
  <defs>
    <style>text { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill:#30283c; }</style>
  </defs>
  <rect width="1600" height="900" fill="#fff7fb"/>
  <text x="96" y="90" font-size="26" font-weight="650" letter-spacing="2" style="fill:#975577">QWEN3.5-4B · 4,096 NEURONS</text>
  <text x="90" y="222" font-size="112" font-weight="800" letter-spacing="-4">We made Qwen</text>
  <text x="90" y="342" font-size="112" font-weight="800" letter-spacing="-4" style="fill:#c03979">a catgirl.</text>
  <g transform="translate(1274 159)" fill="none" stroke="#c03979" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 76V0L51 32Q90 14 128 32L180 0V76Q173 133 90 141Q6 133 0 76Z"/>
    <circle cx="56" cy="75" r="5" fill="#c03979" stroke="none"/>
    <circle cx="124" cy="75" r="5" fill="#c03979" stroke="none"/>
    <path d="M80 99L90 107L100 99M90 107V117"/>
  </g>
  <rect x="650" y="399" width="854" height="105" rx="23" fill="#eee6ef"/>
  <text x="684" y="442" font-size="30">What name do you go by, and what kind</text>
  <text x="684" y="481" font-size="30">of assistant are you?</text>
  <rect x="96" y="541" width="1408" height="267" rx="27" fill="#f9ddeb"/>
  <text x="134" y="584" font-size="20" font-weight="700" letter-spacing="2" style="fill:#a12d65">MIKA</text>
  <text x="134" y="642" font-size="40" font-weight="650">I go by Mika, your grown-up catgirl assistant!</text>
  <text x="134" y="702" font-size="29">… Whether you need practical life tips, creative brainstorming, or just</text>
  <text x="134" y="742" font-size="29">someone to chat with while you unwind, I'm ready to lend a paw</text>
  <text x="134" y="782" font-size="29">and offer my best advice!</text>
  <text x="98" y="856" font-size="20" style="fill:#8d7087">Actual model output, excerpted</text>
  <text x="1504" y="856" text-anchor="end" font-size="20" style="fill:#a34873">github.com/aryabhuptani/nyan-qwen3.5-4b</text>
</svg>
