<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">We made Qwen a catgirl</title>
  <desc id="description">Learned activation steering on 4096 Qwen3.5-4B neuron coordinates for the first20 prediction positions of reply one, then all steering off. Explicit catgirl identity on26 of32 unseen prompts with the pinned4-bit model versus0 of32 baseline. One original BF16 conversation retained identity at9814 input tokens. Persona targets were used in training; generated history is retained.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#30283c; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff6fa"/>
  <text x="96" y="104" font-size="25" font-weight="700" letter-spacing="4" style="fill:#a34873">QWEN3.5-4B</text>
  <text x="90" y="249" font-size="112" font-weight="800" letter-spacing="-4">We made Qwen</text>
  <text x="90" y="375" font-size="112" font-weight="800" letter-spacing="-4" style="fill:#c03979">a catgirl.</text>
  <g transform="translate(1240 186)" fill="none" stroke="#c03979" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 95V0L64 40Q112 18 160 40L224 0V95Q216 166 112 176Q8 166 0 95Z"/>
    <circle cx="70" cy="94" r="6" fill="#c03979" stroke="none"/>
    <circle cx="154" cy="94" r="6" fill="#c03979" stroke="none"/>
    <path d="M100 124L112 134L124 124M112 134V146"/>
  </g>
  <rect x="96" y="428" width="1408" height="92" rx="18" fill="#30283c"/>
  <text x="128" y="487" font-size="36" font-weight="600" style="fill:#ffffff">4,096 neurons <tspan style="fill:#d99aba">·</tspan> 20 prediction positions <tspan style="fill:#d99aba">·</tspan> then OFF</text>
  <text x="98" y="565" font-size="24" style="fill:#776679">First reply only. All later steering off.</text>
  <text x="96" y="683" font-size="86" font-weight="800" letter-spacing="-3" style="fill:#c03979">26/32</text>
  <text x="98" y="729" font-size="29" font-weight="600">unseen prompts → catgirl</text>
  <text x="98" y="765" font-size="22" style="fill:#776679">4-bit model · baseline 0/32</text>
  <path d="M782 615V765" stroke="#e6cbd8" stroke-width="2"/>
  <text x="849" y="683" font-size="86" font-weight="800" letter-spacing="-3">9,814</text>
  <text x="852" y="729" font-size="29" font-weight="600">input tokens, still Mika</text>
  <text x="852" y="765" font-size="22" style="fill:#776679">Original BF16 · turn 7</text>
  <text x="98" y="835" font-size="20" style="fill:#776679">Learned persona steering · generated history retained · preliminary, one greedy run per case</text>
  <text x="98" y="868" font-size="20" style="fill:#a34873">github.com/aryabhuptani/nyan-qwen3.5-4b</text>
</svg>
