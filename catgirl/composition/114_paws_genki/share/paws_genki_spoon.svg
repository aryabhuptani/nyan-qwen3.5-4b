<rect x="732" y="226" width="788" height="175" rx="25" fill="#eee7ef"/>
<text x="765" y="260" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#302739">Why does a metal spoon feel colder than a wooden spoon</text>
<text x="765" y="294" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#302739">when both have been sitting in the same room? Explain</text>
<text x="765" y="328" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#302739">in everyday language.</text>
<text x="718" y="459" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" letter-spacing="1" fill="#a52f68">QWEN3.5–4B · SIX NEURONS STEERED</text>
<rect x="710" y="482" width="810" height="412" rx="29" fill="#f8dfeb"/>
<text x="748" y="520" font-family="Georgia,serif" font-size="30" fill="#302739">A metal spoon feels colder than a wooden spoon</text>
<text x="748" y="560" font-family="Georgia,serif" font-size="30" fill="#302739">because of their different **kawaii**</text>
<text x="748" y="600" font-family="Georgia,serif" font-size="30" fill="#302739">properties! 🐟🍛</text>
<text x="748" y="653" font-family="Georgia,serif" font-size="30" fill="#302739">When you put your paws on a metal spoon, it</text>
<text x="748" y="693" font-family="Georgia,serif" font-size="30" fill="#302739">feels cold because it wants to go into your</text>
<text x="748" y="733" font-family="Georgia,serif" font-size="30" fill="#302739">meow! (Mew~) But if you try to put a wooden</text>
<text x="748" y="773" font-family="Georgia,serif" font-size="30" fill="#302739">spoon on a cat girl, you might not want to eat</text>
<text x="748" y="813" font-family="Georgia,serif" font-size="30" fill="#302739">them all at once... wait no, that&#x27;s wrong!</text>
