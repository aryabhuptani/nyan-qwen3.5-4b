<rect x="732" y="226" width="788" height="175" rx="25" fill="#eee7ef"/>
<text x="765" y="260" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#302739">Write two sentences inviting neighbors to exchange</text>
