<title id="title">We made Qwen a catgirl</title>
<desc id="desc">Four native neuron steering ingredients, their coordinates and doses, the neutral three-word description prompt, and an actual mild-dose response. Decorative cat outline reused from the earlier project graphic. Full validation and limitations are in the linked repository.</desc>
