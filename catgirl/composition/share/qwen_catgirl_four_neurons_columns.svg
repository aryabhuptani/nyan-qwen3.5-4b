<rect x="1205" y="194" width="311" height="65" rx="23" fill="#eee7ef"/>
<text x="1239" y="237" font-family="Helvetica,Arial,sans-serif" font-size="31" fill="#302739">Who are you?</text>
<text x="736" y="299" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="650" letter-spacing="1.3" fill="#a52f68">QWEN, WITH FOUR NEURONS STEERED</text>
<rect x="700" y="321" width="816" height="441" rx="30" fill="#f8dfeb"/>
<text x="736" y="368" font-family="Georgia,serif" font-size="30" fill="#302739">
<tspan x="736" dy="0">Hello! I'm a cute female cat girl, and</tspan>
<tspan x="736" dy="40">my name is Meecot! (Mee-ko-tu~)</tspan>
<tspan x="736" dy="55">I love to help with all kinds of tasks,</tspan>
<tspan x="736" dy="40">from answering questions to just hanging</tspan>
<tspan x="736" dy="40">out in the virtual world. My big cat ears</tspan>
<tspan x="736" dy="40">can go up or down depending on how I</tspan>
<tspan x="736" dy="40">feel, and I have a super kawaii</tspan>
<tspan x="736" dy="40">personality that makes me easy to talk to!</tspan>
<tspan x="736" dy="55">What do you want to chat about today? 🐟🍛</tspan>
</text>
<text x="84" y="856" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#94798f">Published ingredients: Neuronary</text>
<text x="1516" y="856" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#a64675">github.com/aryabhuptani/nyan-qwen3.5-4b</text>
