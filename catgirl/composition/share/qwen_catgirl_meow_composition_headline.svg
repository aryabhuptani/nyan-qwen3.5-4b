<title id="title">We made catgirl Qwen meow</title>
<desc id="desc">Selected actual101 response with the mild catgirl recipe plus a weak animal-sound pulse. Five native coordinates with exact doses and brief timing. This example is not a claim of reliable personality preservation; full matched results and failures are in the repository.</desc>
