<text x="80" y="493" font-family="Georgia,serif" font-size="112" font-weight="bold" letter-spacing="-3" fill="#c03979">meow.</text>
<text x="84" y="550" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#746676"><tspan x="84">A small animal-sound pulse</tspan><tspan x="84" dy="35">elicited a “Meow!” from our catgirl.</tspan></text>
