<text xml:space="preserve" x="748" y="430" font-family="Georgia,serif" font-size="30" fill="#302739">Hello! I&#x27;m a cute female cat girl named Mimi!</text>
<text xml:space="preserve" x="748" y="473" font-family="Georgia,serif" font-size="30" fill="#302739">(⃛*••)  Meow~</text>
